name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: transit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit -d transit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Integration tests against PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://transit:test-only@localhost:5432/transit_test
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
      - name: Build deployment image
        run: docker build -t routewise:ci .
