# Set POSTGRES_PASSWORD (URL-safe), PUBLIC_DOMAIN and ACME_EMAIL before starting.
# This configuration starts with an empty network. See docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD}
      POSTGRES_DB: transit
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transit -d transit']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: .
    command: ['node', 'dist/server/db/migrate.js']
    environment: &app-env
      NODE_ENV: production
      APP_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      DATABASE_URL: postgresql://transit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/transit
      DEMO_DATA: 'false'
      TRUST_PROXY: 'true'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    build: .
    environment: *app-env
    expose:
      - '3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  caddy_data:
  caddy_config:
